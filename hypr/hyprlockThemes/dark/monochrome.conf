# TEXT COLORS
$text-primary = rgb(dcdcdc)
$text-primary-alpha = dcdcdc
$text-secondary = rgb(b4b4b4)
$text-secondary-alpha = b4b4b4
$text-tertiary = rgb(969696)
$text-tertiary-alpha = 969696

# BACKGROUND COLORS (dark to light)
$bg-deepest = rgb(141414)
$bg-deepest-alpha = 141414
$bg-darker = rgb(191919)
$bg-darker-alpha = 191919
$bg-dark = rgb(1e1e1e)
$bg-dark-alpha = 1e1e1e

# SURFACE COLORS (for UI elements)
$surface-dark = rgb(282828)
$surface-dark-alpha = 282828
$surface-medium = rgb(323232)
$surface-medium-alpha = 323232
$surface-light = rgb(464646)
$surface-light-alpha = 464646

# OVERLAY COLORS (for disabled/disabled states)
$overlay-dark = rgb(5a5a5a)
$overlay-dark-alpha = 5a5a5a
$overlay-medium = rgb(6e6e6e)
$overlay-medium-alpha = 6e6e6e
$overlay-light = rgb(828282)
$overlay-light-alpha = 828282

# ACCENT COLORS (main theme color)
$accent-primary = rgb(e0e0e0)
$accent-primary-alpha = e0e0e0

# SEMANTIC COLORS (grayscale only)
$semantic-error = rgb(f0f0f0)
$semantic-error-alpha = f0f0f0
$semantic-warning = rgb(b0b0b0)
$semantic-warning-alpha = b0b0b0
$semantic-success = rgb(d0d0d0)
$semantic-success-alpha = d0d0d0
$semantic-info = rgb(909090)
$semantic-info-alpha = 909090

# UTILITY COLORS (grayscale only)
$utility-blue = rgb(e0e0e0)
$utility-blue-alpha = e0e0e0
$utility-cyan = rgb(c8c8c8)
$utility-cyan-alpha = c8c8c8
$utility-green = rgb(b8b8b8)
$utility-green-alpha = b8b8b8
$utility-yellow = rgb(a8a8a8)
$utility-yellow-alpha = a8a8a8
$utility-orange = rgb(989898)
$utility-orange-alpha = 989898
$utility-red = rgb(f0f0f0)
$utility-red-alpha = f0f0f0
$utility-purple = rgb(d0d0d0)
$utility-purple-alpha = d0d0d0
